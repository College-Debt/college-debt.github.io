{{ define "main" }}
<main class="wp-block-group has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
    <div class="wp-block-group has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
        <h1 class="has-text-align-left wp-block-post-title has-xx-large-font-size has-minecraft-font-family" style="margin-top: 40px; margin-bottom: 40px;" data-pagefind-meta="title">{{ .Title }}</h1>
    </div>
    <div class="entry-content wp-block-post-content has-global-padding is-layout-constrained wp-block-post-content-is-layout-constrained" data-pagefind-body data-pagefind-filter="type:About">
        {{ .Content }}
    </div>
</main>
{{ end }}
