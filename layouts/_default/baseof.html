<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<meta name="robots" content="max-image-preview:large">
	<style>
		img:is([sizes="auto" i], [sizes^="auto," i]) {
			contain-intrinsic-size: 3000px 1500px
		}
	</style>
	<title>{{ if and .Title (not .IsHome) }}{{ if .Data.Singular }}{{ .Data.Singular | title }}: {{ end }}{{ .Title }} &#8211; {{ end }}College Debt Landing Site</title>
	<link rel="stylesheet" href="/css/wp-theme.css">
	<link rel="stylesheet" href="/css/custom.css">
	{{ if or (eq .Section "wiki") (eq .Type "wiki") (in .RelPermalink "/wiki/") }}
	<link rel="preload" href="/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="/webfonts/fa-brands-400.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="/css/all.min.css">
	<link rel="stylesheet" href="/css/wiki.css">
	{{ end }}
	<link rel="icon" href="/assets/images/cropped-Oak_Sign_JE3-32x32.webp" sizes="32x32">
	<link rel="icon" href="/assets/images/cropped-Oak_Sign_JE3-192x192.webp" sizes="192x192">
	<link rel="apple-touch-icon" href="/assets/images/cropped-Oak_Sign_JE3-180x180.webp">
	<meta name="msapplication-TileImage" content="/assets/images/cropped-Oak_Sign_JE3-270x270.webp">
</head>

<body class="home blog wp-custom-logo wp-embed-responsive{{ if or (eq .Section "wiki") (eq .Type "wiki") (in .RelPermalink "/wiki/") }} is-wiki-page{{ end }}">
	<div class="wp-site-blocks">
		{{ partial "header.html" . }}
		{{ block "main" . }}{{ end }}
		{{ partial "footer.html" . }}
	</div>
	<script src="/js/nav.js"></script>
	{{ if or (eq .Section "wiki") (eq .Type "wiki") (in .RelPermalink "/wiki/") }}
	<script src="/js/wiki.js"></script>
	{{ end }}
</body>

</html>
