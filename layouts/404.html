{{ define "main" }}
<main id="main-content" tabindex="-1" class="error-404-main">
  <div class="error-404-container">
    <p class="error-404-badge">Error 404</p>
    <h1 class="error-404-title">Page Not Found</h1>
    <p class="error-404-desc">The page you are looking for does not exist or may have been moved. Please double-check the URL, or head back to Home.</p>
    <div class="error-404-actions">
      <a href="/" class="error-404-btn">
        <span aria-hidden="true">←</span>
        <span>Back to Home</span>
      </a>
      <button type="button" class="error-404-btn error-404-search-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Search site</span>
      </button>
    </div>
  </div>
</main>
{{ end }}
