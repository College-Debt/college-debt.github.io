<div class="site-personalize-modal" id="site-personalize-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Appearance settings">
  <div class="site-personalize-backdrop"></div>
  <div class="site-personalize-dialog" id="site-personalize-dialog">
    <div class="site-personalize-section">
      <div class="site-personalize-label">Theme</div>
      <div class="site-personalize-theme-grid" role="radiogroup" aria-label="Theme">
        <button type="button" class="site-theme-option" data-theme-value="auto" role="radio" aria-checked="true" title="System sync">
          <span class="site-theme-circle site-theme-circle-auto" aria-hidden="true"></span>
          <span class="site-theme-option-text">Auto</span>
        </button>
        <button type="button" class="site-theme-option" data-theme-value="light" role="radio" aria-checked="false" title="Light theme">
          <span class="site-theme-circle site-theme-circle-light" aria-hidden="true"></span>
          <span class="site-theme-option-text">Light</span>
        </button>
        <button type="button" class="site-theme-option" data-theme-value="dark" role="radio" aria-checked="false" title="Dark theme">
          <span class="site-theme-circle site-theme-circle-dark" aria-hidden="true"></span>
          <span class="site-theme-option-text">Dark</span>
        </button>
      </div>
    </div>

    <div class="site-personalize-divider"></div>

    <div class="site-personalize-section">
      <div class="site-personalize-label">Accent</div>
      <div class="site-personalize-accent-grid" role="radiogroup" aria-label="Accent color">
        <button type="button" class="site-accent-swatch" data-accent-value="red" role="radio" aria-checked="false" aria-label="Red" title="Red">
          <span class="site-accent-check" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </button>
        <button type="button" class="site-accent-swatch" data-accent-value="orange" role="radio" aria-checked="false" aria-label="Orange" title="Orange">
          <span class="site-accent-check" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </button>
        <button type="button" class="site-accent-swatch" data-accent-value="lime" role="radio" aria-checked="false" aria-label="Lime" title="Lime">
          <span class="site-accent-check" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </button>
        <button type="button" class="site-accent-swatch" data-accent-value="green" role="radio" aria-checked="false" aria-label="Green" title="Green">
          <span class="site-accent-check" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </button>
        <button type="button" class="site-accent-swatch" data-accent-value="cyan" role="radio" aria-checked="true" aria-label="Cyan (Default)" title="Cyan (Default)">
          <span class="site-accent-check" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </button>
        <button type="button" class="site-accent-swatch" data-accent-value="blue" role="radio" aria-checked="false" aria-label="Blue" title="Blue">
          <span class="site-accent-check" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </button>
        <button type="button" class="site-accent-swatch" data-accent-value="purple" role="radio" aria-checked="false" aria-label="Purple" title="Purple">
          <span class="site-accent-check" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </button>
        <button type="button" class="site-accent-swatch" data-accent-value="pink" role="radio" aria-checked="false" aria-label="Pink" title="Pink">
          <span class="site-accent-check" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </button>
      </div>
    </div>

    <div class="site-personalize-divider"></div>

    <div class="site-personalize-section">
      <div class="site-personalize-label">Font style</div>
      <div class="site-personalize-font-grid" role="radiogroup" aria-label="Font style">
        <button type="button" class="site-font-option" data-font-value="default" role="radio" aria-checked="true" title="Default (Minecraft headings & Inter body)">
          <span class="site-font-specimen site-font-specimen-default" aria-hidden="true"><span class="specimen-mc">A</span><span class="specimen-sans">g</span></span>
          <span class="site-font-option-text">Default</span>
        </button>
        <button type="button" class="site-font-option" data-font-value="sans" role="radio" aria-checked="false" title="Sans (Inter only)">
          <span class="site-font-specimen site-font-specimen-sans" aria-hidden="true">Ag</span>
          <span class="site-font-option-text">Sans</span>
        </button>
        <button type="button" class="site-font-option" data-font-value="serif" role="radio" aria-checked="false" title="Serif (Cardo reading font)">
          <span class="site-font-specimen site-font-specimen-serif" aria-hidden="true">Ag</span>
          <span class="site-font-option-text">Serif</span>
        </button>
        <button type="button" class="site-font-option" data-font-value="mojangles" role="radio" aria-checked="false" title="Mojangles (Minecraft only)">
          <span class="site-font-specimen site-font-specimen-mojangles" aria-hidden="true">Ag</span>
          <span class="site-font-option-text">Mojangles</span>
        </button>
      </div>
    </div>
  </div>
</div>
