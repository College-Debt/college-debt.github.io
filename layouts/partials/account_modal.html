<div class="site-account-modal" id="site-account-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Account">
  <div class="site-account-backdrop"></div>
  <div class="site-account-dialog" id="site-account-dialog">
    <div class="site-account-state" id="site-account-signed-out">
      <p class="site-account-desc is-compact">For members only, sign in with your College Debt Microsoft account to access restricted pages.</p>
      <a class="site-account-btn-action site-account-btn-primary" id="site-account-signin-link" href="/api/login?next=%2F">Sign in</a>
    </div>

    <div class="site-account-state" id="site-account-signed-in" hidden>
      <div class="site-account-head">
        <span class="site-account-avatar is-signed-in" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M20 21a8 8 0 0 0-16 0"></path>
          </svg>
        </span>
        <div class="site-account-head-text">
          <div class="site-account-name-row">
            <span class="site-account-name" id="site-account-name">Signed-in Member</span>
            <span class="site-account-admin-badge" id="site-account-admin-badge" hidden>Admin</span>
          </div>
          <div class="site-account-email" id="site-account-email"></div>
        </div>
      </div>

      <div class="site-account-divider"></div>

      <div class="site-account-links">
        <a class="site-account-link-item" href="/paintings/">
          <span class="site-account-link-main">
            <svg class="site-account-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>Paintings Studio</span>
          </span>
        </a>
        <a class="site-account-link-item" href="https://myaccount.microsoft.com/" target="_blank" rel="noopener noreferrer">
          <span class="site-account-link-main">
            <svg class="site-account-link-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="2" y="2" width="5" height="5" fill="currentColor"></rect>
              <rect x="9" y="2" width="5" height="5" fill="currentColor"></rect>
              <rect x="2" y="9" width="5" height="5" fill="currentColor"></rect>
              <rect x="9" y="9" width="5" height="5" fill="currentColor"></rect>
            </svg>
            <span>Manage Account</span>
          </span>
          <span class="site-account-link-arrow" aria-hidden="true">&#8599;</span>
        </a>
      </div>

      <div class="site-account-divider"></div>

      <a class="site-account-btn-action site-account-signout-btn" id="site-account-signout-link" href="/cdn-cgi/access/logout">Sign out</a>
    </div>
  </div>
</div>
