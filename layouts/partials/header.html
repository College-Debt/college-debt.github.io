<div class="wp-block-group is-layout-flow wp-block-group-is-layout-flow site-header-wrapper" data-pagefind-ignore>
  <header class="wp-block-template-part">
    <div
      class="wp-block-group alignwide has-background has-global-padding is-layout-constrained site-header-group wp-block-group-is-layout-constrained"
      style="background-color:#f0efedc9;margin-top:0px;margin-bottom:0px;padding-top:20px;padding-right:var(--wp--preset--spacing--40);padding-bottom:20px;padding-left:var(--wp--preset--spacing--40)">
      <div
        class="wp-block-group alignwide is-content-justification-space-between is-layout-flex site-header-row wp-block-group-is-layout-flex"
        style="padding-right:0;padding-left:0">
        <div class="site-header-left-group">
          {{ if or (eq .Section "wiki") (eq .Type "wiki") (in .RelPermalink "/wiki/") }}
          <button type="button" class="wiki-mobile-sidebar-toggle" aria-label="Toggle Wiki Navigation" aria-expanded="false">
            <span class="wiki-hamburger-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2.5" ry="2.5"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
              </svg>
            </span>
            <span class="wiki-close-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </span>
          </button>
          {{ end }}
          <div class="wp-block-site-logo"><a href="/" class="custom-logo-link" rel="home"><img width="180" height="38"
                src="/assets/images/collegedebt.svg" class="custom-logo"
                alt="College Debt SMP" decoding="async"></a></div>
        </div>

        <div
          class="wp-block-group is-content-justification-left is-layout-flex site-header-nav-wrapper wp-block-group-is-layout-flex">
          <nav style="font-size: 20px;"
            class="is-responsive items-justified-right wp-block-navigation has-minecraft-font-family is-horizontal is-content-justification-right is-layout-flex site-header-nav wp-block-navigation-is-layout-flex"
            aria-label="Header Navigation">
            <button type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="site-mobile-nav-modal" aria-label="Open menu"
              class="wp-block-navigation__responsive-container-open">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
            <div
              class="wp-block-navigation__responsive-container has-text-color has-base-2-color has-background has-contrast-background-color">
              <div class="wp-block-navigation__responsive-close">
                <div class="wp-block-navigation__responsive-dialog">
                  <div class="wp-block-navigation__responsive-container-content">
                    <ul style="font-size:clamp(0.875rem, 0.875rem + ((1vw - 0.2rem) * 0.542), 1.2rem);"
                      class="wp-block-navigation__container is-responsive items-justified-right wp-block-navigation has-minecraft-font-family">
                      <li style="font-size: clamp(0.875rem, 0.875rem + ((1vw - 0.2rem) * 0.542), 1.2rem);"
                        class=" wp-block-navigation-item wp-block-navigation-link"><a
                          class="wp-block-navigation-item__content" href="/"><span
                            class="wp-block-navigation-item__label">Home</span></a></li>
                      <li style="font-size: clamp(0.875rem, 0.875rem + ((1vw - 0.2rem) * 0.542), 1.2rem);"
                        class=" wp-block-navigation-item is-style-default wp-block-navigation-link"><a
                          class="wp-block-navigation-item__content" href="/wiki/"><span
                            class="wp-block-navigation-item__label">Wiki</span></a></li>
                      <li style="font-size: clamp(0.875rem, 0.875rem + ((1vw - 0.2rem) * 0.542), 1.2rem);"
                        class=" wp-block-navigation-item is-style-default wp-block-navigation-link"><a
                          class="wp-block-navigation-item__content" href="https://status.collegedebt.app/"><span
                            class="wp-block-navigation-item__label">Status</span></a></li>
                      <li style="font-size: clamp(0.875rem, 0.875rem + ((1vw - 0.2rem) * 0.542), 1.2rem);"
                        class=" wp-block-navigation-item wp-block-navigation-link"><a
                          class="wp-block-navigation-item__content" href="/about/"><span
                            class="wp-block-navigation-item__label">About</span></a></li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          </nav>
          <div class="site-header-actions">
            <button type="button" class="site-personalize-btn" aria-label="Appearance settings" title="Appearance" aria-haspopup="dialog" aria-expanded="false">
              <svg class="site-personalize-btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2.12 2.12 0 1 0-3-3Z"></path>
                <path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"></path>
                <path d="M14.5 17.5 4.5 15"></path>
              </svg>
            </button>
            <button type="button" class="site-search-btn" aria-label="Search site" title="Search" aria-haspopup="dialog" aria-expanded="false">
              <svg class="site-search-btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
            <button type="button" class="site-account-btn" aria-label="Account sign in" title="Account" aria-haspopup="dialog" aria-expanded="false">
              <svg class="site-account-icon-key" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="7.5" cy="15.5" r="5.5"></circle>
                <path d="m21 2-9.6 9.6"></path>
                <path d="m15.5 7.5 3 3L22 7l-3-3"></path>
              </svg>
              <svg class="site-account-icon-profile" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M20 21a8 8 0 0 0-16 0"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>
</div>
