<ul class="wp-block-post-template has-body-font-family is-layout-flow wp-block-post-template-is-layout-flow post-entry-list">
{{ $pages := . }}
{{ if reflect.IsMap . }}
  {{ $pages = .posts }}
{{ end }}
{{ range $pages }}
<li class="wp-block-post post type-post status-publish format-standard hentry post-entry-item">
  <article class="post-entry-card">
    <h2 class="wp-block-post-title has-body-font-family post-entry-title">
      <a href="{{ .RelPermalink }}" class="post-entry-main-link" target="_self">{{ .Title }}</a>
    </h2>
    <div class="post-entry-meta">
      <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
      <span aria-hidden="true">&#8211;</span>
      <span>by <a href="/author/{{ default "cherryquartzio" .Params.author | urlize }}/" class="post-entry-meta-link wp-block-post-author-name__link" target="_self">{{ default "CherryQuartzio" .Params.author }}</a></span>
      {{ with .Params.category }}
      <span class="taxonomy-category wp-block-post-terms">in <a href="/category/{{ . | urlize }}/" class="post-entry-meta-link" rel="tag">{{ . }}</a></span>
      {{ end }}
    </div>
  </article>
</li>
{{ end }}
</ul>
