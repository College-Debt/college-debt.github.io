<ul class="wp-block-post-template has-body-font-family is-layout-flow wp-block-post-template-is-layout-flow post-entry-list">
{{ $pages := . }}
{{ if reflect.IsMap . }}
  {{ $pages = .posts }}
{{ end }}
{{ range $pages }}
<li class="wp-block-post post type-post status-publish format-standard hentry post-entry-item">
  <a href="{{ .RelPermalink }}" class="post-entry-card" target="_self">
    <h2 class="wp-block-post-title has-body-font-family post-entry-title">{{ .Title }}</h2>
    <div class="post-entry-meta">
      <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
      <span aria-hidden="true">&#8211;</span>
      <span>by <span class="post-entry-author">{{ default "CherryQuartzio" .Params.author }}</span></span>
      {{ with .Params.category }}
      <span class="taxonomy-category wp-block-post-terms">in <span class="post-entry-category">{{ . }}</span></span>
      {{ end }}
    </div>
  </a>
</li>
{{ end }}
</ul>
