<aside class="wiki-toc-rail" aria-label="Table of Contents">
  <div class="wiki-toc-title">
    <i class="fa-solid fa-list-ul" aria-hidden="true"></i>
    <span>ON THIS PAGE</span>
  </div>
  {{- $toc := .TableOfContents -}}
  {{- if and $toc (ne $toc "<nav id=\"TableOfContents\"></nav>") (ne $toc "") -}}
    {{ $toc }}
  {{- else -}}
    <div class="wiki-toc-empty">Overview</div>
  {{- end -}}
</aside>
