{{ $type := .Get 0 | default (.Get "type") | default "info" }}
<div class="wiki-hint wiki-hint-{{ $type }}">
  <div class="wiki-hint-icon">
    {{ if or (eq $type "warning") (eq $type "warn") }}<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
    {{ else if or (eq $type "danger") (eq $type "error") }}<i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
    {{ else if or (eq $type "success") (eq $type "tip") }}<i class="fa-solid fa-lightbulb" aria-hidden="true"></i>
    {{ else }}<i class="fa-solid fa-circle-info" aria-hidden="true"></i>
    {{ end }}
  </div>
  <div class="wiki-hint-content">
    {{ .Inner | markdownify }}
  </div>
</div>
