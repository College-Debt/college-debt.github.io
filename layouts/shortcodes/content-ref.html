{{ $url := .Get "url" | default (.Get 0) }}
<div class="wiki-content-ref">
  <a href="{{ $url }}" class="wiki-content-ref-link">
    <span class="wiki-content-ref-icon"><i class="fa-solid fa-file-lines" aria-hidden="true"></i></span>
    <span class="wiki-content-ref-text">{{ .Inner | markdownify }}</span>
  </a>
</div>
